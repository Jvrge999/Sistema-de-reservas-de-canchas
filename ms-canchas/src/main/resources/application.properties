spring.application.name=ms-canchas
server.port=8081

# Conexión a la BDD (Usa el nombre del contenedor que pusimos en el compose)
spring.datasource.url=jdbc:mysql://db-canchas:3306/db_canchas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true