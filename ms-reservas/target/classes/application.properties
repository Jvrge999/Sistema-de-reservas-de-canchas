spring.application.name=ms-reservas
server.port=8084

# Conexión a la BDD (Usa el nombre del contenedor que pusimos en el compose)
spring.datasource.url=jdbc:mysql://db-reservas:3306/db_reservas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

usuarios.service.url=${USUARIOS_URL:http://ms-usuarios:8083}
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000